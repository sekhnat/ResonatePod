# Builds Resonate as a Flatpak from the unpacked app electron-builder makes (`npm run dist` leaves it in
# release/linux-unpacked). CI builds it after the package job; to build it by hand:
#   npm run dist && flatpak-builder --user --install --force-clean build-dir flatpak/io.github.sekhnat.resonate.yml
app-id: io.github.sekhnat.resonate
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: resonate-run
separate-locales: false

finish-args:
  - --share=network               # feeds, downloads, directories, sync
  - --share=ipc                   # X11 shared memory
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio           # playback
  - --device=dri                  # video podcasts (GPU)
  - --filesystem=home             # the download folder can be anywhere the user picks, and is read by path
  - --talk-name=org.freedesktop.secrets                 # the keyring that protects saved passwords
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher           # the tray icon
  - --own-name=org.mpris.MediaPlayer2.chromium.*        # media keys and desktop media widgets
  - --env=ELECTRON_OZONE_PLATFORM_HINT=auto

modules:
  - name: resonate
    buildsystem: simple
    sources:
      - type: dir
        path: ../release/linux-unpacked
        dest: resonate
      - type: file
        path: resonate-run.sh
      - type: file
        path: io.github.sekhnat.resonate.desktop
      - type: file
        path: io.github.sekhnat.resonate.metainfo.xml
      - type: file
        path: ../assets/icon-512.png
    build-commands:
      - cp -a resonate /app/resonate
      - install -Dm755 resonate-run.sh /app/bin/resonate-run
      - install -Dm644 io.github.sekhnat.resonate.desktop /app/share/applications/io.github.sekhnat.resonate.desktop
      - install -Dm644 io.github.sekhnat.resonate.metainfo.xml /app/share/metainfo/io.github.sekhnat.resonate.metainfo.xml
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/io.github.sekhnat.resonate.png
