name: CI

# Every push and pull request: typecheck, unit tests, and the Electron end-to-end test,
# then build the AppImage and .deb and smoke-test the packaged app.
# Pushing a tag like v1.4.0 publishes those files as a GitHub release.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:perf
      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - name: End-to-end test
        run: xvfb-run -a npm run test:e2e
        env:
          E2E_SHOTS: ${{ runner.temp }}/e2e-shots
      - name: Keep screenshots when the end-to-end test fails
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e-shots
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package (AppImage, deb)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write # to publish releases from tags
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Build packages
        run: npm run dist -- --publish never
      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - name: End-to-end test against the packaged app
        run: xvfb-run -a node e2e/run.mjs
        env:
          E2E_APP: release/linux-unpacked/resonate
          E2E_SHOTS: ${{ runner.temp }}/e2e-shots
      - name: Keep screenshots when the packaged test fails
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots-packaged
          path: ${{ runner.temp }}/e2e-shots
          if-no-files-found: ignore
          retention-days: 7
      - name: Checksums
        run: cd release && sha256sum *.AppImage *.deb > SHA256SUMS.txt && cat SHA256SUMS.txt
      # Releases are published straight from this job: release files don't count
      # against the account's Actions artifact storage, which can fill up.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Resonate ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            A podcast downloader and player for the Linux desktop.

            **Install**
            - **AppImage** (any distribution): download `Resonate-*.AppImage`, then `chmod +x Resonate-*.AppImage` and run it.
            - **Debian / Ubuntu**: `sudo apt install ./resonate_*_amd64.deb`

            The tray icon uses StatusNotifierItem; on GNOME it needs the AppIndicator extension.
            `SHA256SUMS.txt` lists checksums for both files.
          files: |
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
      # Builds from other pushes are kept for a week; a full artifact quota doesn't fail the run.
      - name: Keep the packages from this run
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: resonate-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
