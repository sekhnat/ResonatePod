name: CI

# Every push and pull request: typecheck, lint, an audit of the shipped dependencies, unit and database tests with
# coverage thresholds, performance budgets, and the Electron end-to-end test,
# then build the AppImage and .deb and smoke-test the packaged app.
# Pushing a tag like v1.4.0 publishes those files as a GitHub release.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Cache the Electron downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Audit the dependencies the app ships
        run: npm audit --omit=dev --audit-level=high
      - name: Unit tests, with coverage thresholds
        run: npm run test:coverage
      - name: Database tests (under Electron's Node)
        run: npm run test:db
      - run: npm run test:perf
      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - name: End-to-end test
        run: xvfb-run -a npm run test:e2e
        env:
          E2E_SHOTS: ${{ runner.temp }}/e2e-shots
      - name: Keep screenshots when the end-to-end test fails
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e-shots
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package (AppImage, deb)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write # to publish releases from tags
      id-token: write # for the keyless signature of the checksums (Sigstore), on tags
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Cache the Electron downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      - run: npm ci
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Build packages
        run: npm run dist -- --publish never
      - name: Install a virtual display and zsync
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb zsync
      - name: End-to-end test against the packaged app
        run: xvfb-run -a node e2e/run.mjs
        env:
          E2E_APP: release/linux-unpacked/resonate
          E2E_SHOTS: ${{ runner.temp }}/e2e-shots
      - name: Keep screenshots when the packaged test fails
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-screenshots-packaged
          path: ${{ runner.temp }}/e2e-shots
          if-no-files-found: ignore
          retention-days: 7
      # The Flatpak job builds from the same unpacked app that was just tested.
      - name: Hand the unpacked app to the Flatpak job
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-unpacked
          path: release/linux-unpacked
          retention-days: 1
      # Puts the address updates come from into the AppImage and writes its .zsync (for AppImageUpdate and the like).
      # This changes the AppImage, so it runs before the checksums are made.
      - name: Add update information to the AppImage
        run: npm run dist:update-info
      - name: Checksums
        run: cd release && sha256sum *.AppImage *.AppImage.zsync *.deb > SHA256SUMS.txt && cat SHA256SUMS.txt
      # Signs the checksums with GitHub's identity for this workflow run (no key to keep): the signature says these
      # files were produced by this repository's workflow at this tag. Verify with the command in the README.
      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the checksums
        if: startsWith(github.ref, 'refs/tags/v')
        run: cosign sign-blob --yes --bundle release/SHA256SUMS.txt.sigstore.json release/SHA256SUMS.txt
      # Releases are published straight from this job: release files don't count
      # against the account's Actions artifact storage, which can fill up.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: Resonate ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            A podcast downloader and player for the Linux desktop.

            **Install**
            - **AppImage** (any distribution): download `Resonate-*.AppImage`, then `chmod +x Resonate-*.AppImage` and run it. It can update itself in place with AppImageUpdate, using the `.zsync` file.
            - **Debian / Ubuntu**: `sudo apt install ./resonate_*_amd64.deb`

            The tray icon uses StatusNotifierItem; on GNOME it needs the AppIndicator extension.
            `SHA256SUMS.txt` lists checksums for the files, and `SHA256SUMS.txt.sigstore.json` is its Sigstore signature (see the README to verify it).
          files: |
            release/*.AppImage
            release/*.AppImage.zsync
            release/*.deb
            release/SHA256SUMS.txt
            release/SHA256SUMS.txt.sigstore.json
          fail_on_unmatched_files: true
      # Builds from other pushes are kept for a week; a full artifact quota doesn't fail the run.
      - name: Keep the packages from this run
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: resonate-linux
          path: |
            release/*.AppImage
            release/*.AppImage.zsync
            release/*.deb
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  flatpak:
    name: Package (Flatpak)
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # An optional extra: a problem here (or a full artifact quota) must not stop the AppImage and deb release.
    continue-on-error: true
    permissions:
      contents: write # to attach the bundle to the release, on tags
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-unpacked
          path: release/linux-unpacked
      # Artifacts don't keep the executable bit.
      - run: chmod +x release/linux-unpacked/resonate release/linux-unpacked/chrome-sandbox release/linux-unpacked/chrome_crashpad_handler
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: resonate.flatpak
          manifest-path: flatpak/io.github.sekhnat.resonate.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - name: Attach the bundle to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" resonate.flatpak --repo "$GITHUB_REPOSITORY" --clobber
